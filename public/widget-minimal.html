<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;overflow-x:hidden}
body{background:transparent;font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-display:swap}
.bar{display:flex;align-items:stretch;width:100%;max-width:500px;height:50px;gap:8px;min-width:0}
.field{flex:1 1 0;min-width:0;display:flex;align-items:center;height:100%;background:#fff;border-radius:5px;border:1px solid #d4d4d4;padding:0 16px;overflow:hidden}
.bar input{flex:1 1 0;min-width:0;width:0;border:none;outline:none;background:transparent;font-size:14px;color:#1a1a1a;font-family:inherit;font-weight:200;height:100%}
.bar button{flex-shrink:0;height:100%;border-radius:5px;background:hsl(36,97%,74%);border:none;display:flex;align-items:center;justify-content:center;padding:0 18px;gap:6px;font-family:inherit;font-weight:500;font-size:13px;color:#1a1a1a;cursor:pointer;transition:background .2s;white-space:nowrap}
.bar button:disabled{cursor:default}
@media(max-width:480px){
.bar{height:46px;gap:6px}
.field{padding:0 12px}
.bar button{padding:0 14px;font-size:12px}
}
@media(max-width:360px){
.bar{height:44px;gap:6px}
.field{padding:0 10px}
.bar input{font-size:13px}
.bar button{padding:0 12px;font-size:12px}
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;500&display=swap" media="print" onload="this.media='all'">
</head>
<body>
<div class="bar">
  <div class="field"><input id="p" placeholder="Real data. Real answers"></div>
  <button id="go" disabled>Ask REID</button>
</div>
<script>
var APP='https://ai.realinfo.id';
var p=document.getElementById('p'),go=document.getElementById('go');
function send(t){t=t.trim();if(!t)return;window.open(APP+'/?prompt='+encodeURIComponent(t),'_blank')}
p.addEventListener('input',function(){go.disabled=!p.value.trim()});
p.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(p.value)}});
go.addEventListener('click',function(){send(p.value)});
</script>
</body>
</html>
